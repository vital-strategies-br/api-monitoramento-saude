# The database runs in a container in both environments (dev and prod).
# Commit 71d532e had removed this service in preparation for a separate
# instance, but that deploy never happened and the file drifted from what
# actually runs — an `up --remove-orphans` would take the database down.
#
# When migrating to RDS, just point POSTGRES_HOST in .env and remove the
# `db` service together with the deploy that shuts it down.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-monitoramento_saude}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-monitoramento_saude}"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-monitoramento_saude}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: monitoramento
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      ENV: ${ENV:-prod}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-monitoramento_saude}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-60}

      # API settings
      API_KEYS: ${API_KEYS}
      API_SECRET: ${API_SECRET}
      REQUIRE_HMAC: ${REQUIRE_HMAC:-false}
      TIMESTAMP_TOLERANCE_SECONDS: ${TIMESTAMP_TOLERANCE_SECONDS:-300}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      ENFORCE_ORIGIN_CHECK: ${ENFORCE_ORIGIN_CHECK:-false}
      TELEMETRY_MAX_BATCH_SIZE: ${TELEMETRY_MAX_BATCH_SIZE:-200}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_EXEMPT_IPS: ${RATE_LIMIT_EXEMPT_IPS:-}
      # Proxies whose X-Forwarded-For is trusted for the client IP (read by gunicorn)
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  postgres_data:
